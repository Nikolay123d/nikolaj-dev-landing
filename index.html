<!doctype html>
<html lang="uk" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Сайт тимчасово оновлюється</title>
  <meta name="description" content="Сайт тимчасово закритий на оновлення.">
  <meta property="og:title" content="Оновлення сайту буде відкрито">
  <meta property="og:description" content="Відкриваємо 1 серпня.">
  <meta property="og:image" content="assets/images/maintenance/site-update-ua.jpg">
  <style>
    html {
      min-height: 100%;
      background: #061426;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #061426;
    }

    .maintenance-screen {
      width: 100vw;
      height: 100svh;
      display: grid;
      place-items: center;
      background: #061426;
    }

    .maintenance-screen__image {
      display: block;
      width: 100vw;
      height: 100svh;
      object-fit: contain;
      object-position: center;
      background: #061426;
    }
  </style>
</head>
<body>
  <main class="maintenance-screen" aria-label="Сайт тимчасово оновлюється">
    <img
      class="maintenance-screen__image"
      src="assets/images/maintenance/site-update-ua.jpg"
      alt="Оновлення сайту буде відкрито 1 серпня"
      width="1024"
      height="1280"
      fetchpriority="high"
      decoding="async"
    >
  </main>
</body>
</html>
